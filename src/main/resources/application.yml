spring:
  datasource:
    # Corregido: Se agregó '_db' para coincidir con tu MySQL Workbench
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/glamgest_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:Jonny2020}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      # Mantenemos 'update' para que reconozca tus tablas actuales
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${SPRING_JPA_SHOW_SQL:true}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

jwt:
  # Secreto seguro para Spring Security
  secret: ${JWT_SECRET:esta_es_una_clave_secreta_muy_larga_y_segura_para_el_proyecto_glamgest_2026}
  expiration: ${JWT_EXPIRATION:3600000}

email:
  service:
    url: ${EMAIL_SERVICE_URL:http://localhost:8081/api/email/send}

logging:
  level:
    com.glamgest.app: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/glamgest.log