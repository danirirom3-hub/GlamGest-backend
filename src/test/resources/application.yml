spring:
  datasource:
    url: jdbc:h2:mem:glamgest_db;MODE=MySQL;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS glamgest_db
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
    open-in-view: false

jwt:
  secret: test-secret-key-with-at-least-32-characters-long
  expiration: 3600000

email:
  service:
    url: http://localhost:8081/api/email/send

google:
  recaptcha:
    secret-key: test-recaptcha-secret
    verify-url: http://localhost/recaptcha
